[package]
name = "sofiie-desktop"
version = "0.1.0"
description = "Allowlisted desktop bridge for Sofiie"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sofiie_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
