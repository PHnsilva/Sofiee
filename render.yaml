services:
  - type: web
    runtime: node
    name: sofiie-api
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace backend --include-workspace-root && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OWNER_ACCESS_KEY
        sync: false
      - key: OWNER_PIN_HASH
        sync: false
      - key: AUTH_SIGNING_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: REQUEST_TIMEOUT_MS
        value: 30000
      - key: RATE_LIMIT_MAX
        value: 60
      - key: LOG_LEVEL
        value: info

  - type: web
    runtime: static
    name: sofiie-web
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace frontend --include-workspace-root && npm run build --workspace frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; manifest-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: Permissions-Policy
        value: 'camera=(), geolocation=(), microphone=(self)'
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
